<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Financial Research Agent</title><link rel="stylesheet" href="/static/style.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head><body><main class="container"><header class="hero"><p class="eyebrow">AI FINANCIAL RESEARCH AGENT</p><h1>Market Research Dashboard</h1><p class="subtitle">Phase 1: market data and technical analysis.</p></header><section class="card"><form id="analysisForm"><div><label for="ticker">Stock ticker</label><input id="ticker" value="AAPL" placeholder="e.g. AAPL" required></div><div><label for="period">Period</label><select id="period"><option value="1mo">1 Month</option><option value="3mo" selected>3 Months</option><option value="6mo">6 Months</option><option value="1y">1 Year</option><option value="2y">2 Years</option></select></div><button id="analyzeBtn">Analyze</button></form><p id="status"></p></section><section id="results" class="hidden"><div class="kpis"><div class="kpi"><span>Latest Price</span><strong id="latestPrice">—</strong></div><div class="kpi"><span>Period Return</span><strong id="periodReturn">—</strong></div><div class="kpi"><span>Annualized Volatility</span><strong id="volatility">—</strong></div><div class="kpi"><span>RSI (14)</span><strong id="rsi">—</strong></div></div><section class="card chart"><h2 id="chartTitle">Price Trend</h2><canvas id="priceChart"></canvas></section><section class="card chart"><h2>Relative Strength Index</h2><canvas id="rsiChart"></canvas></section></section></main><script src="/static/app.js"></script></body></html>
